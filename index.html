<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Loja Driftpink</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #151515;
    margin: 0;
    padding: 20px;
  }

  h1, h2, h3 {
    color: #ff69b4;
  }

  .container {
    max-width: 900px;
    margin: 0 auto;
    background: white;
    padding: 20px;
    box-shadow: 0 0 8px rgba(0,0,0,0.1);
    border-radius: 8px;
  }

  form {
    margin-bottom: 30px;
  }

  label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
  }

  input[type="text"], input[type="number"], input[type="file"] {
    padding: 8px;
    width: 100%;
    box-sizing: border-box;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 1em;
  }

  button {
    margin-top: 15px;
    padding: 10px 20px;
    background-color: #ff69b4;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 4px;
    font-size: 1em;
    transition: background-color 0.3s;
  }

  button:hover {
    background-color: #e0569d;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
  }

  th, td {
    text-align: left;
    padding: 10px;
    border-bottom: 1px solid #ddd;
  }

  .rastreamento {
    margin-top: 30px;
  }

  .status {
    font-weight: bold;
    color: #555;
    margin-top: 10px;
  }

  /* ===== LOJA VIRTUAL ===== */
  .loja {
    margin-top: 50px;
  }

  .produtos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }

  .produto-card {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    background: #fff;
    box-shadow: 0 0 6px rgba(0,0,0,0.1);
    text-align: center;
    transition: transform 0.2s;
  }

  .produto-card:hover {
    transform: translateY(-5px);
  }

  .produto-img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 6px;
    margin-bottom: 10px;
  }

  .produto-nome {
    font-weight: bold;
    margin-bottom: 10px;
  }

  .produto-preco {
    color: #ff69b4;
    font-size: 1.1em;
  }

  .detalhes-btn {
    margin-top: 10px;
    padding: 8px 16px;
    background-color: #ff69b4;
    color: white;
    border: none;
    border-radius: 4px;
    cursor: pointer;
  }

  .detalhes-btn:hover {
    background-color: #e0569d;
  }

  /* Pré-visualização da imagem */
  #preview {
    margin-top: 10px;
    max-width: 200px;
    border-radius: 8px;
    display: none;
  }

</style>

<script charset="UTF-8" type="text/javascript">
window["adrum-start-time"] = new Date().getTime();
(function(config){
    config.appKey = "AD-AAB-ADZ-SWC";
    config.adrumExtUrlHttp = "http://cdn.appdynamics.com";
    config.adrumExtUrlHttps = "https://cdn.appdynamics.com";
    config.beaconUrlHttp = "http://pdx-col.eum-appdynamics.com";
    config.beaconUrlHttps = "https://pdx-col.eum-appdynamics.com";
    config.useHTTPSAlways = true;
    config.resTiming = {"bufSize":200,"clearResTimingOnBeaconSend":true};
    config.maxUrlLength = 512;
})(window["adrum-config"] || (window["adrum-config"] = {}));
</script>
<script src="//cdn.appdynamics.com/adrum/adrum-25.5.0.4580.js"></script>

</head>
<body>
<div class="container">
  <h1>Loja Driftpink</h1>

  <!-- CADASTRO DE PRODUTO -->
  <section>
    <h2>Cadastro de Produto</h2>
    <form id="productForm">
      <label for="productName">Nome do Produto:</label>
      <input type="text" id="productName" required />

      <label for="productPrice">Preço (R$):</label>
      <input type="number" id="productPrice" min="0" step="0.01" required />

      <label for="productImage">Imagem do Produto:</label>
      <input type="file" id="productImage" accept="image/*" required />
      <img id="preview" alt="Pré-visualização da imagem" />

      <button type="submit">Cadastrar Produto</button>
    </form>

    <h3>Produtos Cadastrados</h3>
    <table id="productsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Preço (R$)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </section>

  <!-- RASTREAMENTO -->
  <section class="rastreamento">
    <h2>Rastreamento de Pedido</h2>
    <label for="orderSelect">Selecione o produto para rastrear:</label>
    <select id="orderSelect">
      <option value="">-- Selecione um produto --</option>
    </select>
    <button id="trackBtn">Rastrear Pedido</button>
    <p id="orderStatus" class="status"></p>
  </section>

  <!-- LOJA VIRTUAL -->
  <section class="loja">
    <h2>🛍️ Loja Virtual - Driftpink</h2>
    <p>Veja abaixo os produtos disponíveis:</p>
    <div id="lojaProdutos" class="produtos-grid"></div>
  </section>
</div>

<script>
  const productForm = document.getElementById('productForm');
  const productNameInput = document.getElementById('productName');
  const productPriceInput = document.getElementById('productPrice');
  const productImageInput = document.getElementById('productImage');
  const previewImg = document.getElementById('preview');
  const productsTableBody = document.querySelector('#productsTable tbody');
  const orderSelect = document.getElementById('orderSelect');
  const trackBtn = document.getElementById('trackBtn');
  const orderStatus = document.getElementById('orderStatus');
  const lojaProdutos = document.getElementById('lojaProdutos');

  let products = [];
  let nextId = 1;
  let trackingInterval = null;

  const orderStatuses = [
    'Pedido recebido',
    'Processando',
    'Enviado',
    'Em transporte',
    'Entregue'
  ];

  // Pré-visualização da imagem antes de cadastrar
  productImageInput.addEventListener('change', () => {
    const file = productImageInput.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        previewImg.src = e.target.result;
        previewImg.style.display = 'block';
      };
      reader.readAsDataURL(file);
    } else {
      previewImg.style.display = 'none';
    }
  });

  function updateProductList() {
    productsTableBody.innerHTML = '';
    orderSelect.innerHTML = '<option value="">-- Selecione um produto --</option>';
    lojaProdutos.innerHTML = '';

    products.forEach(prod => {
      // tabela de admin
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${prod.id}</td>
        <td>${prod.name}</td>
        <td>${prod.price.toFixed(2)}</td>
      `;
      productsTableBody.appendChild(row);

      // select rastreamento
      const option = document.createElement('option');
      option.value = prod.id;
      option.textContent = `${prod.name} (R$ ${prod.price.toFixed(2)})`;
      orderSelect.appendChild(option);

      // produto na loja virtual
      const card = document.createElement('div');
      card.classList.add('produto-card');
      card.innerHTML = `
        <img src="${prod.image}" alt="${prod.name}" class="produto-img">
        <div class="produto-nome">${prod.name}</div>
        <div class="produto-preco">R$ ${prod.price.toFixed(2)}</div>
        <button class="detalhes-btn" onclick="alert('Detalhes do produto: ${prod.name}\\nPreço: R$ ${prod.price.toFixed(2)}')">Ver Detalhes</button>
      `;
      lojaProdutos.appendChild(card);
    });
  }

  productForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const name = productNameInput.value.trim();
    const price = parseFloat(productPriceInput.value);
    const file = productImageInput.files[0];

    if (!file) {
      alert('Por favor, selecione uma imagem.');
      return;
    }

    if (name === '' || isNaN(price) || price < 0) {
      alert('Por favor, insira um nome válido e um preço não negativo.');
      return;
    }

    // Lê a imagem e converte para Base64
    const reader = new FileReader();
    reader.onload = function(event) {
      const imageBase64 = event.target.result;

      const newProduct = { id: nextId++, name, price, image: imageBase64 };
      products.push(newProduct);
      updateProductList();

      // limpa o formulário
      productNameInput.value = '';
      productPriceInput.value = '';
      productImageInput.value = '';
      previewImg.style.display = 'none';
    };

    reader.readAsDataURL(file);
  });

  trackBtn.addEventListener('click', () => {
    const selectedId = parseInt(orderSelect.value);

    if (!selectedId) {
      alert('Por favor, selecione um produto para rastrear.');
      return;
    }

    const product = products.find(p => p.id === selectedId);
    if (!product) {
      orderStatus.textContent = '';
      alert('Produto não encontrado.');
      return;
    }

    if (trackingInterval) {
      clearInterval(trackingInterval);
      trackingInterval = null;
    }

    let index = 0;
    orderStatus.textContent = `Status do pedido para "${product.name}": ${orderStatuses[index]}`;

    trackingInterval = setInterval(() => {
      index++;
      if (index < orderStatuses.length) {
        orderStatus.textContent = `Status do pedido para "${product.name}": ${orderStatuses[index]}`;
      } else {
        clearInterval(trackingInterval);
        trackingInterval = null;
      }
    }, 5000);
  });

  updateProductList();

</script>
</body>
</html>
